info:
  contact: {}
  description: gin-vue-blog 后端接口文档。业务状态码 0 表示成功, 其他表示失败, HTTP 状态码统一为 200
  title: gin-vue-blog API
  version: "1.0"
paths:
  /article:
    delete:
      consumes:
      - application/json
      description: 根据 ID 数组物理删除文章, 同时删除文章标签关联与 Redis 中的浏览量/点赞记录
      parameters:
      - description: 文章 ID 数组
        in: body
        name: ids
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "0":
          description: ""
          schema:
            $ref: '#/definitions/handle.Response-int64'
      security:
      - ApiKeyAuth: []
      summary: 物理删除文章（批量）
      tags:
      - Article
    post:
      consumes:
      - application/json
      description: 新增或编辑文章, 分类和标签不存在时按名称自动创建
      parameters:
      - description: 新增或编辑文章
        in: body
        name: form
        required: true
        schema:
          $ref: '#/definitions/handle.AddOrEditArticleReq'
      produces:
      - application/json
      responses:
        "0":
          description: ""
          schema:
            $ref: '#/definitions/handle.Response-model_Article'
      security:
      - ApiKeyAuth: []
      summary: 新增或编辑文章
      tags:
      - Article
  /article/{id}:
    get:
      description: 根据 ID 获取文章详情, 包含分类和标签
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "0":
          description: ""
          schema:
            $ref: '#/definitions/handle.Response-model_Article'
      security:
      - ApiKeyAuth: []
      summary: 获取文章详情
      tags:
      - Article
  /article/export:
    post:
      description: 目前由前端导出, 后端只返回空数据
      produces:
      - application/json
      responses:
        "0":
          description: ""
          schema:
            $ref: '#/definitions/handle.Response-any'
      security:
      - ApiKeyAuth: []
      summary: 导出文章
      tags:
      - Article
  /article/import:
    post:
      consumes:
      - multipart/form-data
      description: 上传 Markdown 文件导入文章, 文件名(去掉扩展名)作为标题。只支持 .md/.markdown, 不超过 5MB。导入后为草稿,
        不带分类和标签, 需要到后台编辑时补充
      parameters:
      - description: Markdown 文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "0":
          description: ""
          schema:
            $ref: '#/definitions/handle.Response-model_Article'
      security:
      - ApiKeyAuth: []
      summary: 导入文章
      tags:
      - Article
  /article/list:
    get:
      description: 后台文章列表, 支持标题/分类/标签/类型/状态/回收站过滤
      parameters:
      - description: 标题关键字
        in: query
        name: title
        type: string
      - description: 分类 ID
        in: query
        name: category_id
        type: integer
      - description: 标签 ID
        in: query
        name: tag_id
        type: integer
      - description: 类型(1-原创 2-转载 3-翻译)
        in: query
        name: type
        type: integer
      - description: 状态(1-公开 2-私密 3-草稿)
        in: query
        name: status
        type: integer
      - description: 是否在回收站
        in: query
        name: is_delete
        type: boolean
      - description: 页码
        in: query
        name: page_num
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "0":
          description: ""
          schema:
            $ref: '#/definitions/handle.Response-handle_PageResult-handle_ArticleVO'
      security:
      - ApiKeyAuth: []
      summary: 条件查询文章列表
      tags:
      - Article
  /article/soft-delete:
    put:
      consumes:
      - application/json
      description: 将文章移入或移出回收站
      parameters:
      - description: 软删除文章
        in: body
        name: form
        required: true
        schema:
          $ref: '#/definitions/handle.SoftDeleteReq'
      produces:
      - application/json
      responses:
        "0":
          description: ""
          schema:
            $ref: '#/definitions/handle.Response-int64'
      security:
      - ApiKeyAuth: []
      summary: 软删除文章（批量）
      tags:
      - Article
  /article/top:
    put:
      consumes:
      - application/json
      description: 修改文章置顶状态
      parameters:
      - description: 修改置顶
        in: body
        name: form
        required: true
        schema:
          $ref: '#/definitions/handle.UpdateArticleTopReq'
      produces:
      - application/json
      responses:
        "0":
          description: ""
          schema:
            $ref: '#/definitions/handle.Response-any'
      security:
      - ApiKeyAuth: []
      summary: 修改文章置顶
      tags:
      - Article
  /category:
    delete:
      consumes:
      - application/json
      description: 分类下存在文章时不允许删除
      parameters:
      - description: 分类 ID 数组
        in: body
        name: ids
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "0":
          description: ""
          schema:
            $ref: '#/definitions/handle.Response-int64'
      security:
      - ApiKeyAuth: []
      summary: 删除分类（批量）
      tags:
      - Category
    post:
      consumes:
      - application/json
      description: 分类名称不能重复
      parameters:
      - description: 新增或编辑分类
        in: body
        name: form
        required: true
        schema:
          $ref: '#/definitions/handle.AddOrEditCategoryReq'
      produces:
      - application/json
      responses:
