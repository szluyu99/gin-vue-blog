name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: gin-blog-server/go.mod
          cache-dependency-path: gin-blog-server/go.sum

      - name: Gofmt
        working-directory: gin-blog-server
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未格式化, 请执行 gofmt -w .:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        working-directory: gin-blog-server
        run: go vet ./...

      - name: Test
        working-directory: gin-blog-server
        run: go test ./...

      # docs/ 是 swag init 的产物, 提交时容易忘记重新生成
      - name: Swagger
        working-directory: gin-blog-server
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init -g ./cmd/main.go
          if ! git diff --quiet docs; then
            echo "docs/ 与代码中的注解不一致, 请执行 ./swag_init.sh 并提交生成结果:"
            git diff --stat docs
            exit 1
          fi

  frontend:
    name: Frontend (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [gin-blog-front, gin-blog-admin]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml

      - name: Install
        working-directory: ${{ matrix.project }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: pnpm lint

      - name: Test
        working-directory: ${{ matrix.project }}
        run: pnpm test

      - name: Build
        working-directory: ${{ matrix.project }}
        run: pnpm build

  # 镜像构建依赖网络与基础镜像, 只在 CI 里验证能否构建并正常启动
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build web image
        run: docker build -t gvb-web:ci .

      - name: Build server image
        run: docker build -t gvb-server:ci gin-blog-server

      - name: Smoke test web image
        run: |
          docker run -d --name gvb-web -p 8080:80 \
            -e USE_HTTPS=false -e SERVER_NAME=localhost \
            -e BACKEND_HOST=127.0.0.1 -e SERVER_PORT=8765 gvb-web:ci
          for i in $(seq 15); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null
          curl -sf http://127.0.0.1:8080/admin/ > /dev/null

      - name: Smoke test server image
        run: |
          docker run -d --name gvb-redis redis:7.0-alpine
          redis_ip=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' gvb-redis)
          # 用 sqlite 起, 不依赖 MySQL 容器
          docker run -d --name gvb-server -p 8765:8765 \
            -e SERVER_DBTYPE=sqlite -e REDIS_ADDR="$redis_ip:6379" gvb-server:ci
          for i in $(seq 15); do
            curl -sf http://127.0.0.1:8765/api/config > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/api/config > /dev/null
          docker logs gvb-server

  # 一键部署的端到端验证: 起完整的 compose 栈, 校验权限种子数据的不变式
  deploy:
    name: Deploy (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bring up the stack
        working-directory: deploy
        run: sh bootstrap.sh

      - name: Wait for backend
        run: |
          for i in $(seq 60); do
            curl -sf http://127.0.0.1:8765/api/config > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/api/config > /dev/null

      - name: Web is served
        run: |
          curl -sf http://127.0.0.1/ > /dev/null
          curl -sf http://127.0.0.1/admin/ > /dev/null

      # generate-data 是权限数据的唯一来源, 这里锁住它的结果:
      # admin 能改配置, guest 不能, 未登录也不能
      - name: Permission invariants
        run: |
          login() {
            curl -s -X POST http://127.0.0.1:8765/api/login \
              -H 'Content-Type: application/json' \
              -d "{\"username\":\"$1\",\"password\":\"123456\"}"
          }
          patch_config() {
            curl -s -X PATCH http://127.0.0.1:8765/api/config \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $1" \
              -d '{"blog_name":"gin-vue-blog"}'
          }

          admin_token=$(login admin | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')
          guest_token=$(login guest | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])')

          admin_resp=$(patch_config "$admin_token")
          echo "admin: $admin_resp"
          echo "$admin_resp" | grep -q '"code":0'

          guest_resp=$(patch_config "$guest_token")
          echo "guest: $guest_resp"
          echo "$guest_resp" | grep -q '"code":1206'

          # 没有 token 的请求必须被拦住 (资源表中登记的接口)
          anon_resp=$(curl -s -X PATCH http://127.0.0.1:8765/api/config \
            -H 'Content-Type: application/json' -d '{}')
          echo "anonymous: $anon_resp"
          echo "$anon_resp" | grep -q '"code":1201'

      # 重启后种子数据不能重复写入
      - name: Seeding is idempotent
        working-directory: deploy/start
        run: |
          # 密码见 deploy/start/.env 的 MYSQL_ROOT_PASSWORD
          count_resource() {
            docker exec gvb-mysql mysql -uroot -p12345566 -N -B -e \
              "SELECT COUNT(*) FROM gvb.resource" 2>/dev/null
          }
          before=$(count_resource)
          docker restart gvb-server
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8765/api/config > /dev/null && break
            sleep 2
          done
          after=$(count_resource)
          echo "resource: $before -> $after"
          [ "$before" = "$after" ]

      - name: Dump logs
        if: failure()
        working-directory: deploy/start
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        working-directory: deploy/start
        run: docker compose down -v
