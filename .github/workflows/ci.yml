name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: gin-blog-server/go.mod
          cache-dependency-path: gin-blog-server/go.sum

      - name: Gofmt
        working-directory: gin-blog-server
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未格式化, 请执行 gofmt -w .:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        working-directory: gin-blog-server
        run: go vet ./...

      - name: Test
        working-directory: gin-blog-server
        run: go test ./...

      # docs/ 是 swag init 的产物, 提交时容易忘记重新生成
      - name: Swagger
        working-directory: gin-blog-server
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init -g ./cmd/main.go
          if ! git diff --quiet docs; then
            echo "docs/ 与代码中的注解不一致, 请执行 ./swag_init.sh 并提交生成结果:"
            git diff --stat docs
            exit 1
          fi

  frontend:
    name: Frontend (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [gin-blog-front, gin-blog-admin]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml

      - name: Install
        working-directory: ${{ matrix.project }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: pnpm lint

      - name: Build
        working-directory: ${{ matrix.project }}
        run: pnpm build
