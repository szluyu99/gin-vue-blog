networks:
  gvb-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET}

services:
  gvb-redis:
    image: redis:7.0-alpine
    container_name: gvb-redis
    restart: always
    volumes:
      - ${DATA_DIRECTORY}/data/redis/:/data
    ports:
      - ${REDIS_PORT}:6379 # 自定义的是暴露出去的端口, Redis 容器内运行固定为 6379
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      gvb-network:
        ipv4_address: ${REDIS_HOST}

  gvb-mysql:
    build: ../build/mysql
    container_name: gvb-mysql
    restart: always
    volumes:
      - ${DATA_DIRECTORY}/data/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=Asia/Shanghai
    ports:
      - ${MYSQL_PORT}:3306 # 自定义的是暴露出去的端口, MySQL 容器内运行固定为 3306
    # 首次启动要导入 gvb.sql, 期间只有 socket 可用, 用 TCP ping 才能反映"真正可连接"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      gvb-network:
        ipv4_address: ${MYSQL_HOST}

  gvb-server:
    build: ../../gin-blog-server
    container_name: gvb-server
    restart: always
    # 后端服务依赖 MySQL 和 Redis
    # 用 service_healthy: MySQL 首次导入 gvb.sql 需要时间, 只等"已启动"会让后端反复崩溃重启
    depends_on:
      gvb-redis:
        condition: service_healthy
      gvb-mysql:
        condition: service_healthy
    volumes:
      - ${DATA_DIRECTORY}/file/uploaded:/gvb/public/uploaded
    # JWT_SECRET / SESSION_SALT: 由 deploy/bootstrap.sh 生成, 不进仓库
    # config.docker.yml 是 release 模式, 后端启动时会拒绝空值和仓库里的示例密钥
    # 缺这个文件 compose 会直接报错, 先在 deploy 目录跑一次 bootstrap.sh
    env_file:
      - .env.secrets
    environment:
      # 以下环境变量会覆盖后端源码中 config.docker.yml 中的配置
      - TZ=Asia/Shanghai
      # SERVER
      - SERVER_PORT=:${SERVER_PORT} # 服务端口
      # MySQL
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=3306
      - MYSQL_DBNAME=gvb # 默认 gvb, 改动需要修改 gvb-mysql 镜像
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Redis
      - REDIS_ADDR=${REDIS_HOST}:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    networks:
      gvb-network:
        ipv4_address: ${BACKEND_HOST}

  gvb-web:
    # 根据不同环境变量找不同 Dockerfile, 执行操作不同
    build: ${WEB_BUILD_CONTEXT}
    container_name: gvb-web
    restart: always
    # 需要开启 https, 请提供证书, 并设置 USE_HTTPS=true
    volumes:
      - ./server.crt:/etc/nginx/crt/server.crt
      - ./server.key:/etc/nginx/crt/server.key
    environment:
      - USE_HTTPS=${USE_HTTPS} # 使用 https 设置为 true
      - SERVER_NAME=${SERVER_NAME} # 域名 或 localhost
      - BACKEND_HOST=${BACKEND_HOST} # 后端服务地址
      - SERVER_PORT=${SERVER_PORT} # 服务端口
    ports:
      - "80:80"
      - "443:443"
    networks:
      gvb-network:
        ipv4_address: ${FRONTEND_HOST}
